<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f0e">
  <title>Zombie Escape</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three/three.module.js",
        "three/addons/": "./lib/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="crosshair"><span></span><span></span><span></span><span></span></div>
    <div id="hitmarker"></div>
    <div id="damage-flash"></div>

    <div id="hud-top-left">
      <div id="kills">Kills: <b id="kill-count">0</b></div>
    </div>

    <div id="hud-bottom-left">
      <div class="bar"><div id="health-fill"></div></div>
      <div id="health-text">100</div>
    </div>

    <div id="hud-bottom-right">
      <div id="weapon-name">Pistol</div>
      <div id="ammo"><b id="ammo-mag">12</b> / <span id="ammo-reserve">∞</span></div>
      <div id="reload-text" class="hidden">Reloading…</div>
    </div>

    <!-- Touch controls (shown only on touch devices) -->
    <div id="touch-ui" class="hidden">
      <div id="joystick"><div id="joystick-knob"></div></div>
      <button id="btn-fire" class="touch-btn">FIRE</button>
      <button id="btn-reload" class="touch-btn small">R</button>
      <button id="btn-pause" class="touch-btn small">II</button>
    </div>
  </div>

  <!-- Screens -->
  <div id="screen-loading" class="screen">
    <h1>Zombie Escape</h1>
    <p id="loading-text">Loading… 0%</p>
  </div>

  <div id="screen-title" class="screen hidden">
    <h1>Zombie Escape</h1>
    <p class="subtitle">Stage 1 test build</p>
    <button id="btn-play" class="menu-btn">Play</button>
    <p class="hint" id="controls-hint"></p>
  </div>

  <div id="screen-pause" class="screen hidden">
    <h2>Paused</h2>
    <button id="btn-resume" class="menu-btn">Resume</button>
  </div>

  <div id="screen-dead" class="screen hidden">
    <h2 class="danger">You Died</h2>
    <p>Kills: <b id="final-kills">0</b></p>
    <button id="btn-restart" class="menu-btn">Try Again</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
